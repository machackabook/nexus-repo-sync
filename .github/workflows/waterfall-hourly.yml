name: Waterfall Repo Sync

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: waterfall-catalog-main
  cancel-in-progress: true

jobs:
  sync-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
      - name: Catalog mesh neighbors
        run: |
          set -euo pipefail
          echo "mesh: continuity-ledger-cycle The-Hive gaia-visualizer Cryptic-Heartbeat NEXUS-SENTINEL-LEDGER"
          bash scripts/env-check.sh
          bash scripts/gaia-preflight.sh
