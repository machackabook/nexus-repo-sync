name: cascade-hourly
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [continuity-cascade, pull-then-push]
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: env-check
        run: bash scripts/env-check.sh
      - name: stamp
        run: |
          mkdir -p docs
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          HASH=$(printf '%s' "$TS-137451921129154222-sync" | sha256sum | awk '{print $1}')
          {
            echo "# LEDGER-STAMP"
            echo "- utc: $TS"
            echo "- numeral: 137451921129154222"
            echo "- surface: nexus-repo-sync"
            echo "- team: enhance"
            echo "- version: v1.3.0-speedway"
            echo "- drive-mesh: 1mm2HZPvfvtubSBbOkv3_3Nfhn8mejyu8"
            echo "- sha256: \`$HASH\`"
          } > docs/LEDGER-STAMP.md
          git config user.name "continuity-engine"
          git config user.email "continuity@local"
          git add docs/LEDGER-STAMP.md
          git diff --cached --quiet || git commit -m "sync: team-enhance stamp (137451921129154222)"
          git push || true
      - name: fanout-siblings
        if: ${{ secrets.CASCADE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.CASCADE_TOKEN }}
        run: |
          for repo in The-Hive Cryptic-Heartbeat gaia-visualizer ENCLAVE-ADAM-REUNITED; do
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/machackabook/$repo/dispatches \
              -d '{"event_type":"continuity-cascade"}' || true
          done
