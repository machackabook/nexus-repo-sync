name: cascade-hourly

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [continuity-cascade, pull-then-push]

permissions:
  contents: write

concurrency:
  group: cascade-main
  cancel-in-progress: false

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: env-check
        run: bash scripts/env-check.sh

      - name: preflight
        run: bash scripts/gaia-preflight.sh

      - name: catalog and stamp
        run: |
          set -euo pipefail
          mkdir -p docs
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          HASH=$(printf '%s' "$TS-137451921129154222-sync-v1" | sha256sum | awk '{print $1}')
          {
            echo "# LEDGER-STAMP"
            echo "- utc: $TS"
            echo "- numeral: 137451921129154222"
            echo "- surface: nexus-repo-sync"
            echo "- team: enhance"
            echo "- policy: config/gaia-sync.json"
            echo "- sha256: \`$HASH\`"
          } > docs/LEDGER-STAMP.md
          cat scripts/cascade_targets.txt

      - name: durable commit
        run: |
          set -euo pipefail
          git config user.name "gaia-evolution"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LEDGER-STAMP.md
          if git diff --cached --quiet; then
            echo "no durable delta"
            exit 0
          fi
          git commit -m "sync: GAIA cascade evidence ${{ github.run_id }}"
          git push

      - name: optional fanout
        if: ${{ secrets.CASCADE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.CASCADE_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r repo; do
            [[ -z "$repo" || "$repo" == "#"* ]] && continue
            if [[ "$repo" == "machackabook/nexus-repo-sync" ]]; then continue; fi
            curl --fail-with-body -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/dispatches" \
              -d '{"event_type":"continuity-cascade"}'
          done < scripts/cascade_targets.txt
